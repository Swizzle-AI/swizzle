global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "swizzle_edge_control_plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["swizzle-gateway:8080"]
        labels:
          service: "swizzle-gateway"
          environment: "enterprise-production"

