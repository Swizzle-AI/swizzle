version: "3.9"

services:
  swizzle-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: swizzle-enterprise-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_URL=${UPSTREAM_URL:-https://employers-willow-integrate-penetration.trycloudflare.com/v1}
      - SWIZZLE_CLUSTER_SALT=${SWIZZLE_CLUSTER_SALT:-swizzle-enterprise-zdr-kv-salt-v1}
      - SWIZZLE_KEY_PEPPER=${SWIZZLE_KEY_PEPPER:-swizzle-hmac-key-pepper-2026}
      - VALKEY_ADDR=valkey:6379
    depends_on:
      - valkey
    restart: always

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: swizzle-valkey-ledger
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: swizzle-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - swizzle-gateway
    restart: always

